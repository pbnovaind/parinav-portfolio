    <g fill="#ef4f1e"><circle cx="105" cy="402" r="13"/><circle cx="450" cy="400" r="13"/><circle cx="795" cy="410" r="13"/><circle cx="1180" cy="370" r="13"/><circle cx="1300" cy="380" r="13"/></g>
    <g fill="#211d1b" font-size="17"><text x="72" y="650">Questions</text><text x="324" y="650">Drafts</text><text x="576" y="650">Feedback</text><text x="828" y="650">Decisions</text><text x="1080" y="650">Confidence</text></g>
