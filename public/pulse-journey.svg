<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Pulse report publishing journey</title>
  <desc id="desc">A journey map showing planning, authoring, review, approval, and publishing stages.</desc>
