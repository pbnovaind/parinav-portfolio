  <text x="72" y="82" fill="#211d1b" font-family="Arial,sans-serif" font-size="24" font-weight="700">IDENTIFYING THE JOURNEY</text>
  <text x="72" y="124" fill="#7b6d64" font-family="Arial,sans-serif" font-size="18">One report, five connected moments</text>
  <g font-family="Arial,sans-serif">
    <g fill="#f5e7db"><rect x="72" y="178" width="230" height="92" rx="18"/><rect x="324" y="178" width="230" height="92" rx="18"/><rect x="576" y="178" width="230" height="92" rx="18"/><rect x="828" y="178" width="230" height="92" rx="18"/><rect x="1080" y="178" width="248" height="92" rx="18"/></g>
    <g fill="#6f1d2e" font-size="21" font-weight="700"><text x="98" y="225">01  PLAN</text><text x="350" y="225">02  CREATE</text><text x="602" y="225">03  REVIEW</text><text x="854" y="225">04  APPROVE</text><text x="1106" y="225">05  PUBLISH</text></g>
