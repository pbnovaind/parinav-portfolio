<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parinav Badal — product designer, mentor, cyclist, and motorsports enthusiast." />
    <link rel="icon" href="/parinav-favicon-v2.svg?v=5" type="image/svg+xml" sizes="any" />
    <link rel="shortcut icon" href="/parinav-favicon-v2.svg?v=5" type="image/svg+xml" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>Parinav Badal — Product Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
